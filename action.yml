name: 'Changelog Parser'
description: 'Parses changelog file'
branding:
  icon: 'clock'
  color: 'blue'
inputs:
  path:
    description: 'Path to the changelog file. By default standard changelog locations are used.'
    required: false
    default: ''
  version:
    description: 'Version of the changelog entry. By default the last released version is used.'
    required: false
    default: ''
  skip-bump-bullet-checks:
    description: |
      Escape hatch — set 'true' to bypass the two misplaced-bump validation rules
      (bump bullets in the file intro / inside a tagged release section).
      Default 'false'; the rules ship strict and exist to catch bugs the
      cascade bump-strategy script previously produced. Setting 'true' emits a
      workflow warning and only disables those two rules — version-header
      parsing, ordering, and duplicate detection still run. Intended for
      surgical, time-bound use; fix the underlying RELEASE.md and remove the
      flag in the next change.
    required: false
    default: 'false'
outputs:
  version:
    description: 'Version from the changelog entry'
  versionMajor:
    description: 'The major version part'
  versionMinor:
    description: 'The minor version part'
  versionPatch:
    description: 'The patch version part'
  buildNumber:
    description: 'Build number (only for non-prod versions)'
  suffix:
    description: 'Suffix for non-prod versions (dev, rc, int)'
  date:
    description: 'Release date from the changelog entry'
  description:
    description: 'Description from the changelog entry'
  isProductionRelease:
    description: 'true if version is a production release (e.g. v1.2.3), false otherwise'
runs:
  using: 'node20'
  main: 'build/dist/index.js'
